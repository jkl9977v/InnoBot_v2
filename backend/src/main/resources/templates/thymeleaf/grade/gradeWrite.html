<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	직급 생성 <br/>
	<form action="/admin/grade/gradeWrite" method="post">
	gradeId: <input type="text" name="gradeId" th:value="${command.gradeId}" readonly>[[${command.gradeId}]]   번호 자동생성 <br/>
	gradeName: <input type="text" name="gradeName" placeholder="직급 이름"> <br/>
	gradeLevel : <select id="gradeLevel" name="gradeLevel">
	<option th:each="i : ${#numbers.sequence(1, 20)}"
	th:value="${i}"
          th:text="${i}"
          th:selected="${command.gradeLevel == i }"/>
	</select>
	 <br/>
	<button type="submit">생성</button>
	</form>
</body>
</html>
