<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	접근규칙 생성 <br/>
	<form action="/admin/accessRule/ruleWrite" method="post" >
	access_id: <input type="text" name="accessId" th:value="${command.accessId}" readonly>[[${command.accessId}]]   번호 자동생성 <br/>
	accessName: <input type="text" name="accessName" placeholder="규칙 이름"> <br/>
	allowdId:  <input type="text" name="allowdId" placeholder="허용부서"> <br/>
	allowgId: <input type="text" name="allowgId" placeholder="허용등급"> <br/>
	accessType:  <select type="text" name="accessType">
		<option value="허용 안함" selected>허용 안함</option>
		<option value="모두 허용" >모두 허용</option>
		<option value="내부 전체 허용" >내부 전체 허용</option>
		<option value="일부 부서 허용" >일부 부서 허용</option>
		<option value="특정 직급 이상 허용" >특정 직급 이상 허용</option>
		<option value="일부 부서의 특정 직급 이상 허용" >일부 부서의 특정 직급 이상 허용</option>
	</select><br/>
	<button type="submit">생성</button>
	</form>
</body>
</html>
