<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/img/tiumBot1.png" />
  <title>TiumBotAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
	<link href="/css/file.css" rel="stylesheet">
</head>
<body>
  <aside>
    <h2>폴더</h2>
    <ul class="folder-tree">
      <li>📁 기술문서</li>
      <li>📁 영업자료</li>
      <li>📁 인사정보</li>
      <li>📁 보안기준</li>
    </ul>
  </aside>
  <main>
    <div class="toolbar">
      <a class="button" th:href="@{/admin/file}">파일/경로 관리</a>
      <a class="button" th:href="@{/admin/user}" >사용자 설정</a>
      <a class="button" th:href="@{/admin/chatbot}">챗봇 설정</a>
      <a class="button" th:href="@{/admin/logout}">로그아웃</a>
      
    </div>

  <h2 >접근규칙 관리</h2>
  <p>
  <a class="button" th:href="@{/admin/accessRule/ruleWrite}">접근규칙 생성</a> | 
  <a class="button" th:href="@{/admin/accessRule/allowdWrite}">허용 부서 규칙 생성</a> 
  <a class="button" th:href="@{/admin/accessRule/allowdList}">허용 부서 규칙 설정</a> | 
  <a class="button" th:href="@{/admin/accessRule/allowgWrite}">허용 직급 규칙 생성</a> 
  <a class="button" th:href="@{/admin/accessRule/allowgList}">허용 직급 규칙 설정</a><br/>
  </p>
    <form action="/admin/accessRule/ruleList" method="get">
  	허용 타입 : <select class="select" id="category" name="kind">
  		<option value="" th:selected="${kind ==null or kind==''}">전체</option>
  		<option value="허용 안함" th:selected="${kind =='허용 안함'}">허용 안함</option>
  		<option value="모두 허용" th:selected="${kind =='모두 허용'}">모두 허용</option>
  		<option value="내부 전체 허용" th:selected="${kind =='내부 전체 허용'}">내부 전체 허용</option>
  		<option value="일부 부서 허용" th:selected="${kind =='일부 부서 허용'}">일부 부서 허용</option>
  		<option value="특정 직급 이상 허용" th:selected="${kind =='특정 직급 이상 허용'}">특정 직급 이상 허용</option>
  		<option value="일부 부서의 특정 직급 이상 허용" th:selected="${kind =='일부 부서의 특정 직급 이상 허용'}">일부 부서의 특정 직급 이상 허용</option>
  	</select>
  	검색어 : <input type="text" name="searchWord" th:value="${searchWord}">
  	행: <select id="category" name="limitRow" >
      	<option value="10" th:selected="${limitRow==10 or limitRow == null or limitRow==''}">10개씩</option>
      	<option value="15" th:selected="${limitRow==15}">15개씩</option>
      	<option value="20" th:selected="${limitRow==20}">20개씩</option>
      	<option value="25" th:selected="${limitRow==25}">25개씩</option>
      	<option value="30" th:selected="${limitRow==30}">30개씩</option>
      	</select>
    <button class="button" type="submit">검색</button>
  </form>
    <table class="file-table">
      <thead>
        <tr>
          <th>접근규칙</th>
          <th>허용 타입</th>
          <th>자세히</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="dto:${list}">
          <td>[[${dto.accessName}]]</td>
          <td>[[${dto.accessType}]]</td>
          <td> <a class="button" 
          th:href="@{/admin/accessRule/ruleUpdate?(accessId=${dto.accessId})}">자세히</a>
          <a class="button" 
          th:href="@{/admin/accessRule/ruleDelete?(accessId=${dto.accessId})}">삭제</a></td>
        </tr>
        <tr>
        <td th:if="${list.size()==0}" colspan="10" align="center"> 검색결과가 없습니다.</td>
        </tr>
      </tbody>
      <tr>
      	<td colspan="5" align="center">
      		<span th:if="${page<=1}">[이전]</span>
      		<span th:if="${page>1}" 
      		th:href="@{/admin/accessRule/ruleList(page=${page-1},searchWord=${searchWord})}">
      		[이전]</span>
      		<th:block th:each="i:${#numbers.sequence(startPageNum, endPageNum)}">
      			[<a th:href="@{/admin/accessRule/ruleList(page=${page},searchWord=${searchWord})}">[[${i}]]</a>]
      		</th:block>
      		<span th:if="${page<maxPage}" 
      		th:href="@{/admin/accessRule/ruleList(page=${page+1},searchWord=${searchWord})}">[다음]</span>
      		<span th:if="${page>=maxPage}">[다음]</span>
      	</td>
      </tr>
    </table>
  </main>
</body>
</html>
