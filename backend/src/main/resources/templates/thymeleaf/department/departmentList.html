<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/img/tiumBot1.png" />
  <title>TiumBotAdmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
	<link href="/css/file.css" rel="stylesheet">
</head>
<body>
  <aside>
    <h2>폴더</h2>
    <ul class="folder-tree">
      <li>📁 기술문서</li>
      <li>📁 영업자료</li>
      <li>📁 인사정보</li>
      <li>📁 보안기준</li>
    </ul>
  </aside>
  <main>
    <div class="toolbar">
      <a class="button" th:href="@{/admin/file}">파일/경로 관리</a>
      <a class="button" th:href="@{/admin/accessRule}">접근규칙 설정</a>
      <a class="button" th:href="@{/admin/user}" >사용자 설정</a>
      <a class="button" th:href="@{/admin/chatbot}">챗봇 설정</a>
      <a class="button" th:href="@{/admin/logout}">로그아웃</a>
      
    </div>

  <h2 >부서 관리</h2>
  <p>
  <a class="button" th:href="@{/admin/department/departmentWrite}">부서 생성</a> | 
  <a class="button" th:href="@{/admin/grade/gradeList}">직급 관리</a><br/>
  </p>
    <form action="/admin/department/departmentList" method="get">
  	검색어 : <input type="text" name="searchWord" th:value="${searchWord}">
  	행: <select id="category" name="limitRow" >
      	<option value="10" th:selected="${limitRow==10 or limitRow == null or limitRow==''}">10개씩</option>
      	<option value="15" th:selected="${limitRow==15}">15개씩</option>
      	<option value="20" th:selected="${limitRow==20}">20개씩</option>
      	<option value="25" th:selected="${limitRow==25}">25개씩</option>
      	<option value="30" th:selected="${limitRow==30}">30개씩</option>
      	</select>
    <button class="button" type="submit">검색</button>
  </form>
    <table class="file-table">
      <thead>
        <tr>
          <th>부서</th>
          <th>부서명</th>
          <th>자세히</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="dto:${list}">
          <td>[[${dto.departmentId}]]</td>
          <td>[[${dto.departmentName}]]</td>
          <td> <a class="button" 
          th:href="@{/admin/department/departmentUpdate(departmentId=${dto.departmentId})}">자세히</a>
          <a class="button" 
          th:href="@{/admin/department/departmentDelete(departmentId=${dto.departmentId})}">삭제</a></td>
        </tr>
        <tr>
        <td th:if="${list.size()==0}" colspan="10" align="center"> 검색결과가 없습니다.</td>
        </tr>
      </tbody>
      <tr>
      	<td colspan="6" align="center">
      	<span th:if="${page<=1}">[이전]</span>
      	<span th:if="${page>1}" th:href="@{/admin/department/departmentList(page=${page-1},searchWord=${searchWord})}">[이전]</span>
      	<th:block th:each="i:${#numbers.sequence(startPageNum,endPageNum)}">
      		[<a th:href="@{/admin/department/departmentList?(page=${i},searchWord=${searchWord})}">[[${i}]]</a>]
      	</th:block>
      	<span th:if="${page<maxPage}" th:href="@{/admin/department/departmentList(page=${page+1},searchWord=${searchWord})}">[다음]</span>
      	<span th:if="${page>=maxPage}">[다음]</span>
      	</td>
      </tr>
    </table>
  </main>
</body>
</html>
